[project]
name = "call-operator"
version = "0.1.0"
description = "Real-time AI meeting agent — joins video calls, listens, and responds with generated voice"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    # Config
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # LLM
    "langchain>=0.3",
    "langchain-core>=0.3",
    # Browser automation
    "playwright>=1.40",
    # Audio processing
    "numpy>=1.26",
    # STT - local (faster-whisper)
    "faster-whisper>=1.0",
    # VAD
    "silero-vad>=5.0",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.optional-dependencies]
# LLM providers (install the ones you need)
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
google = ["langchain-google-genai>=2.0"]
# STT cloud provider
deepgram = ["deepgram-sdk>=3.0"]
# TTS providers
elevenlabs = ["elevenlabs>=1.0"]
google-tts = ["google-cloud-texttospeech>=2.0"]
openai-tts = ["openai>=1.0"]
# All providers
all = [
    "call-operator[openai,anthropic,google,deepgram,elevenlabs,google-tts,openai-tts]",
]
# Development
dev = [
    "call-operator[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
call-operator = "call_operator.main:app"

[tool.uv]
package = true

[tool.uv.sources]

[tool.uv.workspace]
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_operator"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "silero_vad.*",
    "torch.*",
    "deepgram.*",
    "elevenlabs.*",
    "google.cloud.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
